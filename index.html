<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#556B2F">
<title>创作工作台</title>
<style>
:root{
  --olive:#556B2F; --olive-d:#3F5223; --olive-l:#6B8E3C;
  --olive-soft:#EEF3E7; --olive-soft2:#E2EAD4;
  --bg:#F4F6F1; --surface:#FFFFFF; --surface-2:#FAFBF7;
  --border:#E5E8DE; --border-strong:#D2D8C7;
  --text:#1F2A14; --text-2:#5C6B4A; --text-3:#8E9781;
  --danger:#C0392B; --danger-bg:#FBEAE7;
  --warn:#B8860B; --warn-bg:#FBF3DC;
  --info:#2C6F8A; --info-bg:#E3F0F5;
  --radius:14px; --radius-s:10px; --radius-l:20px;
  --shadow:0 2px 8px rgba(40,55,20,.08);
  --shadow-l:0 8px 24px rgba(40,55,20,.14);
  --drawer-w:280px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;font-size:15px;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
ul{list-style:none}

/* ===== App shell ===== */
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:40;height:56px;
  background:var(--olive);color:#fff;
  display:flex;align-items:center;gap:12px;padding:0 14px;
  box-shadow:0 2px 8px rgba(40,55,20,.18);
}
.topbar .icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#fff}
.topbar .icon-btn:active{background:rgba(255,255,255,.18)}
.topbar h1{font-size:17px;font-weight:600;flex:1;letter-spacing:.3px}
.topbar .refresh-btn{font-size:12px;display:flex;align-items:center;gap:4px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.16)}
.topbar .refresh-btn:active{background:rgba(255,255,255,.28)}
.topbar svg{display:block}

/* ===== Drawer ===== */
.drawer-mask{position:fixed;inset:0;background:rgba(20,28,10,.45);z-index:60;opacity:0;visibility:hidden;transition:.25s}
.drawer-mask.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:var(--drawer-w);max-width:82vw;
  background:var(--surface);z-index:70;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-l);
}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:24px 20px 18px;background:var(--olive);color:#fff}
.drawer-head .avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;margin-bottom:10px}
.drawer-head h2{font-size:17px;font-weight:600}
.drawer-head p{font-size:12px;opacity:.82;margin-top:2px}
.drawer-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;
  border-radius:var(--radius-s);font-size:15px;color:var(--text-2);font-weight:500;text-align:left;
}
.nav-item svg{width:21px;height:21px;flex-shrink:0;color:var(--text-3)}
.nav-item.active{background:var(--olive-soft);color:var(--olive-d);font-weight:600}
.nav-item.active svg{color:var(--olive)}
.nav-item:active{background:var(--surface-2)}
.drawer-foot{padding:14px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);line-height:1.5}

/* ===== Page ===== */
.page{display:none;padding:16px 14px 90px;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-title{font-size:20px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.page-sub{font-size:13px;color:var(--text-2);margin-bottom:16px}

/* ===== Progress ===== */
.progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-row .lbl{font-size:13px;color:var(--text-2);font-weight:500}
.progress-row .val{font-size:15px;font-weight:700;color:var(--olive-d)}
.progress-bar{height:8px;background:var(--olive-soft);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--olive),var(--olive-l));border-radius:999px;transition:width .4s ease;width:0}

/* ===== Card ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);margin-bottom:12px;position:relative}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-title{font-size:15px;font-weight:600;line-height:1.4;flex:1}
.card-desc{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.2px}
.tag.olive{background:var(--olive-soft);color:var(--olive-d)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.danger{background:var(--danger-bg);color:var(--danger)}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-mini{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text)}
.btn-mini:active{transform:scale(.97)}
.btn-mini.olive{background:var(--olive);color:#fff;border-color:var(--olive)}
.btn-mini.olive:active{background:var(--olive-d)}
.card-del{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);opacity:0}
.card:active .card-del,.card-del.show{opacity:1}
.card-del:active{background:var(--danger-bg);color:var(--danger)}

/* ===== Checkbox list ===== */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:8px;box-shadow:var(--shadow)}
.check-item:active{background:var(--surface-2)}
.check-item.done .ci-text{color:var(--text-3);text-decoration:line-through}
.checkbox{width:22px;height:22px;border:2px solid var(--border-strong);border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px}
.check-item.done .checkbox{background:var(--olive);border-color:var(--olive)}
.checkbox svg{width:13px;height:13px;color:#fff;opacity:0;transition:.15s}
.check-item.done .checkbox svg{opacity:1}
.ci-body{flex:1;min-width:0}
.ci-text{font-size:15px;font-weight:500;line-height:1.4;word-break:break-word}
.ci-meta{font-size:12px;color:var(--text-3);margin-top:2px}
.ci-del{color:var(--text-3);padding:4px;opacity:.5}
.ci-del:active{color:var(--danger);opacity:1}

/* ===== Add button ===== */
.add-btn{width:100%;padding:13px;border:1.5px dashed var(--border-strong);border-radius:var(--radius-s);color:var(--text-2);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;margin-top:6px}
.add-btn:active{border-color:var(--olive);color:var(--olive);background:var(--olive-soft)}

/* ===== FAB ===== */
.fab{position:fixed;right:18px;bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--olive);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(85,107,47,.4);z-index:45}
.fab:active{transform:scale(.93);background:var(--olive-d)}

/* ===== Stat grid (复盘) ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:11px 6px;text-align:center;box-shadow:var(--shadow)}
.stat-cell .n{font-size:18px;font-weight:700;color:var(--olive-d);line-height:1.2}
.stat-cell .l{font-size:11px;color:var(--text-2);margin-top:3px}

/* ===== Memo lines ===== */
.memo-line{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:7px;box-shadow:var(--shadow)}
.memo-line.done .ml-text{text-decoration:line-through;color:var(--text-3)}
.memo-line .checkbox{width:20px;height:20px;border-radius:6px}
.memo-line .ml-text{flex:1;font-size:14px;border:none;background:transparent;outline:none;padding:2px 0}
.memo-line .ml-text::placeholder{color:var(--text-3)}

/* ===== Practice / accumulation list ===== */
.pa-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.pa-item .pi-title{font-size:14px;font-weight:600;margin-bottom:5px;line-height:1.4}
.pa-item .pi-meta{font-size:12px;color:var(--text-3);margin-bottom:7px}
.pa-item .pi-content{font-size:13px;color:var(--text-2);line-height:1.6;white-space:pre-wrap}

/* ===== Empty / loading ===== */
.empty{text-align:center;padding:36px 16px;color:var(--text-3);font-size:13px}
.empty svg{margin:0 auto 10px;opacity:.5}
.loading{text-align:center;padding:30px;color:var(--text-2);font-size:13px}
.spinner{width:26px;height:26px;border:3px solid var(--olive-soft);border-top-color:var(--olive);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

.source-note{font-size:11px;color:var(--text-3);margin-top:8px;padding:8px 10px;background:var(--warn-bg);border-radius:var(--radius-s);line-height:1.5}

/* ===== Modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(20,28,10,.5);z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal-mask.open{display:flex}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:var(--radius-l) var(--radius-l) 0 0;padding:20px 18px 24px;animation:sheet .25s ease}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.fg input,.fg textarea,.fg select{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-s);background:var(--surface-2)}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft)}
.fg textarea{min-height:72px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions button{flex:1;padding:13px;border-radius:var(--radius-s);font-size:15px;font-weight:600}
.btn-cancel{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.btn-ok{background:var(--olive);color:#fff}
.btn-ok:active{background:var(--olive-d)}

/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(31,42,20,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <header class="topbar">

function load(){try{const r=localStorage.getItem(KEY);if(!r)return def();return{...def(),...JSON.parse(r)}}catch(e){return def()}}

function def(){return{
  plan:[
    {id:uid('t'),text:'选题灵感整理',done:false},
    {id:uid('t'),text:'拍摄 1 条短视频',done:false},
    {id:uid('t'),text:'剪辑 + 发布',done:false},
    {id:uid('t'),text:'回复评论互动',done:false}
  ],

/* ============ Toast ============ */
let toastT;

/* ============ Drawer ============ */
const drawer=document.getElementById('drawer'),mask=document.getElementById('drawerMask');

function switchPage(p){
  curPage=p;
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===p));
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+p));

/* ============ Plan ============ */
function renderPlan(){
  const list=document.getElementById('planList');
  const items=state.plan;
  list.innerHTML=items.length?items.map(t=>`
    <div class="check-item ${t.done?'done':''}" data-id="${t.id}">
      <div class="checkbox">${I.check}</div>
      <div class="ci-body"><div class="ci-text">${esc(t.text)}</div></div>
      <button class="ci-del" data-del="${t.id}">${I.trash}</button>
    </div>`).join(''):'<div class="empty">暂无任务</div>';
  const done=items.filter(x=>x.done).length,tot=items.length;
  const rate=tot?Math.round(done/tot*100):0;
  document.getElementById('planRate').textContent=rate+'%';
  document.getElementById('planFill').style.width=rate+'%';
  list.querySelectorAll('.check-item').forEach(el=>{
    el.querySelector('.checkbox').onclick=()=>{const t=state.plan.find(x=>x.id===el.dataset.id);if(t){t.done=!t.done;save();renderPlan()}}
    el.querySelector('.ci-del').onclick=e=>{e.stopPropagation();state.plan=state.plan.filter(x=>x.id!==el.dataset.id);save();renderPlan()}
  });
}
document.getElementById('planAdd').onclick=()=>openModal('plan');
document.getElementById('fab').onclick=()=>{
  if(curPage==='plan')openModal('plan');
  else if(curPage==='review')openModal('review');
  else if(curPage==='teardown')openModal('teardown');
  else if(curPage==='memo')addMemoLine();
};

/* ============ Inspire (优先同域 daily.json，回退 Gist) ============ */
async function fetchDaily(){
  // 优先：同域 daily.json（与网页同在 github.io，国内访问稳定不被墙）
  try{
    const r=await fetch('daily.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){return await r.json()}
  }catch(e){}
  // 回退：Gist（国内可能超时）
  if(window.GIST_ID){
    try{
      const url=window.GITHUB_TOKEN
        ?`https://api.github.com/gists/${window.GIST_ID}`
        :`https://gist.githubusercontent.com/${window.GIST_ID}/raw`;
      const opt=window.GITHUB_TOKEN?{headers:{Authorization:'token '+window.GITHUB_TOKEN}}:{};
      const r=await fetch(url,opt);
      if(!r.ok)throw 0;
      const data=await r.json();
      let raw;
      if(data.files){const f=Object.values(data.files)[0];raw=f?f.content:''}
      else raw=await r.text();
      return JSON.parse(raw);
    }catch(e){}
  }
  return null;
}
async function renderInspire(force){
  const box=document.getElementById('inspireList');
  if(!force&&state.inspireCache&&state.cacheDate===today()){
    drawInspire(state.inspireCache);return;
  }
  box.innerHTML='<div class="loading"><div class="spinner"></div>正在拉取今日灵感…</div>';
  const g=await fetchDaily();
  if(g&&g.inspire){
    state.inspireCache=g.inspire;state.viralCache=g.viral||null;state.cacheDate=today();save();
    drawInspire(g.inspire);
  }else{
    box.innerHTML='<div class="empty">拉取失败，点右上角刷新重试。</div>';
  }
}
function drawInspire(list){
  const box=document.getElementById('inspireList');
  if(!list||!list.length){box.innerHTML='<div class="empty">今日暂无灵感</div>';return}
  box.innerHTML=list.map((it,i)=>`
    <div class="card">
      <div class="card-head">
        <div class="card-title">${i+1}. ${esc(it.title)}</div>
        ${it.tag?`<span class="tag olive">${esc(it.tag)}</span>`:''}
      </div>
      ${it.desc?`<div class="card-desc">${esc(it.desc)}</div>`:''}
      <div class="card-actions">
        <button class="btn-mini olive" data-search="${encodeURIComponent(it.title)}" data-plat="douyin">${I.douyin}抖音找</button>
        <button class="btn-mini" data-search="${encodeURIComponent(it.title)}" data-plat="bili">${I.bilibili}B站找</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('.btn-mini').forEach(b=>b.onclick=()=>jumpSearch(b.dataset.search,b.dataset.plat));
}

/* ============ Viral ============ */
async function renderViral(force){
  const box=document.getElementById('viralList');
  if(!force&&state.viralCache&&state.cacheDate===today()){
    drawViral(state.viralCache);return;
  }
  box.innerHTML='<div class="loading"><div class="spinner"></div>正在拉取今日热点…</div>';
  const g=await fetchDaily();
  if(g&&g.viral){
    state.viralCache=g.viral;state.inspireCache=g.inspire||null;state.cacheDate=today();save();
    drawViral(g.viral);
  }else{
    box.innerHTML='<div class="empty">拉取失败，点右上角刷新重试。</div>';
  }
}
function drawViral(list){
  const box=document.getElementById('viralList');
  if(!list||!list.length){box.innerHTML='<div class="empty">今日暂无热点</div>';return}
  box.innerHTML=list.map((it,i)=>`
    <div class="card">
      <div class="card-head">
        <div class="card-title">${i+1}. ${esc(it.title)}</div>
        ${it.tag?`<span class="tag warn">${esc(it.tag)}</span>`:''}
      </div>
      ${it.hot?`<div class="card-desc">🔥 ${esc(it.hot)}</div>`:''}

      <div class="card-actions">

        <button class="btn-mini" data-search="${encodeURIComponent(it.title)}" data-plat="bili">${I.bilibili}B站看</button>

    </div>`).join('');
  box.querySelectorAll('.btn-mini').forEach(b=>b.onclick=()=>jumpSearch(b.dataset.search,b.dataset.plat));

/* jump:唤起App，失败回退网页搜索 */
function jumpSearch(q,plat){
  // 直接打开网页搜索，Safari/微信内置浏览器都兼容
  const url=plat==='douyin'
    ?`https://www.douyin.com/search/${encodeURIComponent(q)}`
    :`https://search.bilibili.com/all?keyword=${encodeURIComponent(q)}`;
  window.open(url,'_blank');
}
function tryOpenApp(q,plat){
  // 尝试唤起App，失败回退网页（用户主动点"打开App"时用）
  const web=plat==='douyin'
    ?`https://www.douyin.com/search/${encodeURIComponent(q)}`
    :`https://search.bilibili.com/all?keyword=${encodeURIComponent(q)}`;
  const scheme=plat==='douyin' ? `snssdk1129://search?keyword=${encodeURIComponent(q)}` : `bilibili://search?keyword=${encodeURIComponent(q)}`;
  location.href=scheme;
  setTimeout(()=>{window.open(web,'_blank')},500);
}

/* ============ Teardown (爆款拆解) ============ */

  const box=document.getElementById('teardownList');

  if(!items.length){box.innerHTML='<div class="empty">还没有拆解记录</div>';return}
  box.innerHTML=items.map(t=>`
    <div class="card">
      <button class="card-del show" data-del="${t.id}">${I.trash}</button>
      <div class="card-title">${esc(t.title)}</div>
      <div class="ci-meta">${esc(t.date)}</div>

      ${t.structure?`<div class="card-desc"><b>📐 结构：</b>${esc(t.structure)}</div>`:''}

}
document.getElementById('teardownAdd').onclick=()=>openModal('teardown');

/* ============ Review ============ */
function renderReview(){
  const box=document.getElementById('reviewList');
  const items=state.review||[];
  if(!items.length){box.innerHTML='<div class="empty">还没有复盘记录</div>';return}
  box.innerHTML=items.map(r=>`
    <div class="card">
      <button class="card-del show" data-del="${r.id}">${I.trash}</button>
      <div class="card-title">${esc(r.title)}</div>
      <div class="ci-meta">${esc(r.date)}</div>
      <div class="stat-grid" style="margin-top:10px">

        <div class="stat-cell"><div class="n">${esc(r.comment||0)}</div><div class="l">评论</div></div>

document.getElementById('reviewAdd').onclick=()=>openModal('review');

/* ============ Memo ============ */
function renderMemo(){
  const box=document.getElementById('memoList');
  box.innerHTML=state.memo.map(m=>`
    <div class="memo-line ${m.done?'done':''}" data-id="${m.id}">
      <div class="checkbox">${I.check}</div>
      <input class="ml-text" placeholder="写点什么…" value="${esc(m.text)}">
      <button class="ci-del" data-del="${m.id}">${I.trash}</button>
    </div>`).join('');
  box.querySelectorAll('.memo-line').forEach(el=>{
    const id=el.dataset.id,m=state.memo.find(x=>x.id===id);
    el.querySelector('.checkbox').onclick=()=>{m.done=!m.done;save();renderMemo()};
    const inp=el.querySelector('.ml-text');
    inp.oninput=()=>{m.text=inp.value;save()};
    el.querySelector('[data-del]').onclick=()=>{state.memo=state.memo.filter(x=>x.id!==id);save();renderMemo()};
  });
}
function addMemoLine(){state.memo.push({id:uid('m'),text:'',done:false});save();renderMemo();setTimeout(()=>{const ls=document.querySelectorAll('.memo-line');const last=ls[ls.length-1];if(last)last.querySelector('input').focus()},50)}
document.getElementById('memoAdd').onclick=addMemoLine;

/* ============ Render dispatcher ============ */
function render(p){
  if(p==='plan')renderPlan();
  else if(p==='inspire')renderInspire(false);
  else if(p==='viral')renderViral(false);
  else if(p==='teardown')renderTeardown();
  else if(p==='review')renderReview();
  else if(p==='memo')renderMemo();
}

/* ============ Refresh ============ */
document.getElementById('refreshBtn').onclick=async()=>{
  if(curPage==='inspire'){await renderInspire(true);toast('已刷新灵感')}
  else if(curPage==='viral'){await renderViral(true);toast('已刷新热点')}
  else{toast('本页无需刷新')}
};

/* ============ Modal ============ */
const modalMask=document.getElementById('modalMask'),modalBox=document.getElementById('modalBox');
let modalMode=null;
function openModal(mode){
  modalMode=mode;
  const body=document.getElementById('modalBody');
  const title=document.getElementById('modalTitle');
  if(mode==='plan'){
    title.textContent='新增任务';
    body.innerHTML=`<div class="fg"><input id="m_text" placeholder="任务内容，如：拍摄1条口播"></div>`;
  }else if(mode==='review'){
    title.textContent='新增复盘';
    body.innerHTML=`
      <div class="fg"><label>标题</label><input id="m_title" placeholder="如：7/27 口播视频"></div>
      <div class="fg" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label>播放</label><input id="m_play" type="number" inputmode="numeric" placeholder="0"></div>
        <div><label>点赞</label><input id="m_like" type="number" inputmode="numeric" placeholder="0"></div>
        <div><label>评论</label><input id="m_comment" type="number" inputmode="numeric" placeholder="0"></div>
        <div><label>转发</label><input id="m_share" type="number" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="fg"><label>✨ 亮点</label><textarea id="m_highlight" placeholder="做得好的地方"></textarea></div>
      <div class="fg"><label>⚠️ 问题</label><textarea id="m_problem" placeholder="不足之处"></textarea></div>
      <div class="fg"><label>🚀 优化</label><textarea id="m_optimize" placeholder="下次怎么改"></textarea></div>`;
  }else if(mode==='teardown'){
    title.textContent='新增爆款拆解';
    body.innerHTML=`
      <div class="fg"><label>视频标题</label><input id="m_title" placeholder="如：沉浸式回家vlog"></div>
      <div class="fg"><label>🎯 开头钩子（前3秒）</label><textarea id="m_hook" placeholder="前3秒用什么抓住了注意力"></textarea></div>
      <div class="fg"><label>📐 视频结构</label><textarea id="m_structure" placeholder="如：钩子→痛点→方案→对比→CTA"></textarea></div>
      <div class="fg"><label>✨ 亮点</label><textarea id="m_highlights" placeholder="值得学习的地方"></textarea></div>
      <div class="fg"><label>🔄 可复用模板</label><textarea id="m_reuse" placeholder="能套用到自己赛道的点"></textarea></div>`;
  }
  modalMask.classList.add('open');
  setTimeout(()=>{const f=modalBox.querySelector('input,textarea');if(f)f.focus()},100);
}
function closeModal(){modalMask.classList.remove('open');modalMode=null}
document.getElementById('modalCancel').onclick=closeModal;
modalMask.onclick=e=>{if(e.target===modalMask)closeModal()};
document.getElementById('modalOk').onclick=()=>{
  if(modalMode==='plan'){
    const t=document.getElementById('m_text').value.trim();
    if(!t){toast('请输入任务');return}
    state.plan.push({id:uid('t'),text:t,done:false});save();renderPlan();closeModal();toast('已添加');
  }else if(modalMode==='review'){
    const title=document.getElementById('m_title').value.trim();
    if(!title){toast('请输入标题');return}
    state.review.unshift({
      id:uid('r'),title,date:today(),
      play:document.getElementById('m_play').value||0,
      like:document.getElementById('m_like').value||0,
      comment:document.getElementById('m_comment').value||0,
      share:document.getElementById('m_share').value||0,
      highlight:document.getElementById('m_highlight').value.trim(),
      problem:document.getElementById('m_problem').value.trim(),
      optimize:document.getElementById('m_optimize').value.trim()
    });
    save();renderReview();closeModal();toast('已保存复盘');
  }else if(modalMode==='teardown'){
    const title=document.getElementById('m_title').value.trim();
    if(!title){toast('请输入标题');return}
    state.teardown.unshift({
      id:uid('td'),title,date:today(),
      hook:document.getElementById('m_hook').value.trim(),
      structure:document.getElementById('m_structure').value.trim(),
      highlights:document.getElementById('m_highlights').value.trim(),
      reuse:document.getElementById('m_reuse').value.trim()
    });
    save();renderTeardown();closeModal();toast('已保存拆解');
  }
};

/* ============ Init ============ */
function initDate(){
  const d=new Date();
  const w=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('todayStr').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${w}`;
}
initDate();
renderPlan();
</script>
